spring:
  datasource:
    url: jdbc:mysql://prod-db:3306/projectmg
    username: projectmg
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  sql:
    init:
      mode: never

  flyway:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

server:
  tomcat:
    use-native: false
