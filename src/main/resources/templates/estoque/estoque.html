<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout}">
<body th:fragment="content">
<div class="card mt-2">
    <p>Passou aqui</p>
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title"><i class="fa-solid fa-users"></i> Estoque de Matéria Prima</h5>
        <div class="btn-group">
            <a class="btn btn-success" href="/mg/estoque/cadastrar"><i class="fa-solid fa-plus"></i> Adicionar</a>
<!--            <button type="button" class="btn btn-success dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-expanded="false">-->
<!--                <span class="visually-hidden">Toggle</span>-->
<!--            </button>-->
<!--            <ul class="dropdown-menu">-->
<!--                <li><a class="dropdown-item" href="/mg/estoque?display=false">Excluídos</a></li>-->
<!--                <li><a class="dropdown-item" href="/mg/estoque">Ativos</a></li>-->
<!--            </ul>-->
        </div>

    </div>
    <div class="card-body">
        <table id="tabela" class="table table-bordered">
            <thead>
            <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="estoque : ${material}">
                <td th:text="${material.id}"></td>
                <td th:text="${material.nome}"></td>
                <td>
                    <div class="btn-group">
                        <a class="btn btn-light" th:href="@{/estoque/atualizar/{id}(id=${material.id})}"><i class="fa-solid fa-pen-ruler"></i> Alterar</a>
                        <a class="btn btn-light" th:href="@{/estoque/buscar/{id}(id=${material.id})}"><i class="fa-solid fa-magnifying-glass"></i> Visualizar</a>
<!--                        <div th:if="${material.ativo}">-->
<!--                            <a class="btn btn-light" th:href="@{/estoque/deletar/{id}(id=${material.id})}"><i class="fa-solid fa-trash"></i> Remover</a>-->
<!--                        </div>-->
<!--                        <div th:if="${not material.ativo}">-->
<!--                            <a class="btn btn-light" th:href="@{/estoque/remover/{id}(id=${material.id})}"><i class="fa-solid fa-reply"></i> Recuperar</a>-->
<!--                        </div>-->
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/traducao-datatables-ptbr.js}"></script>
<script type="text/javascript">
    $(document).ready(function (){
        $("#tabela").DataTable({
            language: datatable_pt_br
        });
    });
</script>
</body>
</html>
